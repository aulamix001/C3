name: Windows x64 VST3

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-vst3-release
  cancel-in-progress: false

jobs:
  windows-vst3:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 2>&1 | ForEach-Object { "$_" } | Tee-Object configure.log
          if ($LASTEXITCODE -ne 0) {
            $diagnostics = (Get-Content configure.log | Select-Object -Last 45) -join '%0A'
            Write-Output "::error::$diagnostics"
            exit 1
          }
      - name: Build VST3
        shell: pwsh
        run: |
          cmake --build build --config Release --target NXProC3_VST3 NXCompressorTests --parallel 3 2>&1 | ForEach-Object { "$_" } | Tee-Object build.log
          if ($LASTEXITCODE -ne 0) {
            $errors = Select-String -Path build.log -Pattern 'error|failed' | Select-Object -Last 20
            $errors | ForEach-Object { Write-Output "::error::$($_.Line)" }
            exit 1
          }
      - name: Run DSP and state tests
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Run pluginval at strictness 10
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'pluginval.zip'
          $directory = Join-Path $env:RUNNER_TEMP 'pluginval'
          Invoke-WebRequest 'https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip' -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne 'c08e61ce3b96db41636f8ec7e76f4c7e2c13ebdac7fa1b5a1f52b4f32ec715ab') {
            throw "pluginval ZIP checksum mismatch"
          }
          Expand-Archive -LiteralPath $zip -DestinationPath $directory
          $bundle = (Resolve-Path 'build/NXProC3_artefacts/Release/VST3/NX PRO C 3.vst3').Path
          $process = Start-Process -FilePath (Join-Path $directory 'pluginval.exe') -Wait -PassThru `
            -ArgumentList @('--strictness-level', '10', '--validate', ('"' + $bundle + '"')) `
            -RedirectStandardOutput pluginval.log -RedirectStandardError pluginval-error.log
          Get-Content pluginval.log
          Get-Content pluginval-error.log
          if ($process.ExitCode -ne 0) {
            $tail = (Get-Content pluginval.log -Tail 30) -join '%0A'
            Write-Output "::error::pluginval exited with code $($process.ExitCode)%0A$tail"
            exit $process.ExitCode
          }
          if (!(Select-String -Path pluginval.log -Pattern '^SUCCESS\s*$' -Quiet)) {
            throw "pluginval did not report success"
          }
      - name: Verify and package VST3
        shell: pwsh
        run: |
          $bundle = 'build/NXProC3_artefacts/Release/VST3/NX PRO C 3.vst3'
          $module = Join-Path $bundle 'Contents/x86_64-win/NX PRO C 3.vst3'
          if (!(Test-Path $module -PathType Leaf)) { throw "Windows VST3 module is missing" }
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path $module))
          $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          if ([BitConverter]::ToUInt32($bytes, $pe) -ne 0x4550 -or
              [BitConverter]::ToUInt16($bytes, $pe + 4) -ne 0x8664) {
            throw "Expected a Windows x64 PE module"
          }
          Compress-Archive -LiteralPath $bundle -DestinationPath NX-PRO-C-3-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: NX-PRO-C-3-windows-x64
          path: NX-PRO-C-3-windows-x64.zip
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag NX-PRO-C-3-windows-x64.zip --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag NX-PRO-C-3-windows-x64.zip --verify-tag --repo $env:GITHUB_REPOSITORY --title "NX PRO C 3 — Windows x64" --notes "VST3 para Windows 64 bits. Extraia a pasta .vst3 inteira para C:\Program Files\Common Files\VST3 e atualize a lista de plug-ins da DAW."
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
